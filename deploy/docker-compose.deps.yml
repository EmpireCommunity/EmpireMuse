# Só o MongoDB do EmpireMuse (dependência opcional). O bot não vem aqui: este arquivo serve a dois usos.
#
# 1) Com o bot em container (mesmo projeto, mesma rede; o bot alcança o banco pelo host "mongo"):
#      docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.deps.yml --env-file .env up -d
#    Com o bot em container, suba SEMPRE o par. Subir só o deploy/docker-compose.yml no mesmo projeto trata o "mongo" como
#    órfão, e "--remove-orphans" o derrubaria.
# 2) Sozinho, para rodar o bot sem container (deploy/local/run.sh ou run.bat): o banco responde só em 127.0.0.1
#    (porta ${MONGO_LOCAL_PORT:-27017}) e o MONGO do bot usa o host 127.0.0.1.
#      docker compose -f deploy/docker-compose.deps.yml up -d
#
# Segurança: o MongoDB sobe SEMPRE com autenticação (--auth) e a porta nunca sai de 127.0.0.1. O .env.mongo (na raiz do
# repositório, nunca versionado, obrigatório) traz só o usuário e a senha do root, usados apenas na criação do banco:
#   MONGO_INITDB_ROOT_USERNAME=
#   MONGO_INITDB_ROOT_PASSWORD=
# Para o dia a dia, crie um usuário próprio do bot com a função readWriteAnyDatabase (veja o fim do .example.env) e use
# o MONGO desse usuário; nunca escreva senha neste arquivo.
#
# Dados: o volume tem o nome fixo "empiremuse_empiremuse-mongo", o mesmo do antigo perfil "mongo" do compose padrão, então
# quem já usava esse perfil mantém os dados (passos exatos em "Ao atualizar" no CHANGELOG). Nunca use "down -v" aqui.
name: empiremuse

services:
  mongo:
    container_name: empiremuse-mongo
    image: mongo:8.0.34@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    # Autenticação explícita (não depender só do comportamento da imagem na criação do banco).
    command: ["--auth"]
    restart: unless-stopped
    env_file:
      - path: ../.env.mongo
        required: true
    # Endurecimento possível com esta imagem: sem escalada de privilégio (o gosu da imagem usa chamadas de sistema, não binário
    # setuid) e limites de memória e processos. O cap_drop ALL NÃO serve aqui: a criação do banco precisa do chown e do gosu.
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    memswap_limit: 1024m
    pids_limit: 1024
    # Só no próprio host. Nunca "27017:27017" nem 0.0.0.0/::.
    ports:
      - "127.0.0.1:${MONGO_LOCAL_PORT:-27017}:27017"
    volumes:
      - empiremuse-mongo:/data/db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  empiremuse-mongo:
    # Nome real do volume do antigo perfil "mongo" (projeto empiremuse + empiremuse-mongo): os dados ficam.
    name: empiremuse_empiremuse-mongo
