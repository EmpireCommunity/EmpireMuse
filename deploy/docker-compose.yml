# Compose base do EmpireMuse (Docker Compose com suporte a env_file e a vários arquivos -f).
# Uso, a partir da raiz do repositório:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
# O .env (e o .env.mongo do compose de deps) ficam na raiz do repositório.
# Com o MongoDB do compose de deps (mesmo projeto e mesma rede), suba SEMPRE o par:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.deps.yml --env-file .env up -d
name: empiremuse

services:
  bot:
    container_name: empiremuse
    # Imagem oficial do Docker Hub. Em produção, prefira fixar uma versão exata (ex.: or4cu1o/empiremuse:2.0.2
    # ou digest). A tag :2 é flutuante (acompanha a série 2.x) e a latest aponta para a última versão estável.
    image: ${EMPIREMUSE_IMAGE:-or4cu1o/empiremuse:latest}
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    env_file: ../.env
    mem_limit: ${EMPIREMUSE_MEM_LIMIT:-1024m}
    memswap_limit: ${EMPIREMUSE_MEM_LIMIT:-1024m}
    volumes:
      - empiremuse-data:/data
    ports:
      - "${EMPIREMUSE_PORT:-127.0.0.1:6000}:6000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  empiremuse-data:
