openapi: 3.1.0
info:
  title: API do bot EmpireMuse para painéis externos
  version: 1.0.0
  summary: Contrato público e versionado entre o bot e um painel externo (BFF).
  description: |
    Fonte da verdade da API `/api/v1` (contrato T-456, §4 e §7). O que o bot serve hoje é a **fundação (B1)**:
    `/meta`, `/health`, as sessões de usuário e o envelope de erro; mais **conta, servidores e configurações (B3)**.
    Jukebox, rádios e apagar dados entram nos PRs seguintes, que estendem este arquivo.

    **Rede.** A API vive num listener próprio e interno (`EXTERNAL_PANEL_API_BIND` e `EXTERNAL_PANEL_API_PORT`), nunca na
    porta pública. O navegador só fala com o painel; quem chama a API é o servidor do painel.

    **Credenciais.**
    - Chave de serviço: `Authorization: Bearer <EXTERNAL_PANEL_API_SECRET>`, em toda rota menos `/health`.
    - Token de sessão: `X-EM-Session: <token>`, que identifica o usuário. O `user_id` vem sempre da sessão, nunca de
      corpo, caminho ou cabeçalho.
    - O bot ignora cookies, não envia `Set-Cookie` e não envia nenhum `Access-Control-*` (sem CORS).

    **Corpos.** Os corpos de requisição são JSON e exigem `Content-Type: application/json`; o corpo máximo é de 16 KiB
    (acima disso a conexão é fechada, sem resposta). Datas são ISO 8601 em UTC com `Z`, em segundos.

    **Cabeçalhos de toda resposta** (inclusive erros): `Cache-Control: no-store`, `X-Content-Type-Options: nosniff` e
    `X-Request-ID`. O painel pode mandar o próprio `X-Request-ID` (8 a 64 caracteres de `A-Za-z0-9_-`); fora desse
    formato o bot gera outro. O id nunca carrega o IP do usuário.

    **Erros.** Toda falha vem no envelope `{"error": {"code", "fields"?, "request_id"}}`, sem texto de usuário final
    nem rastreio. O `code` é estável e o status acompanha a situação; o mesmo `code` com status diferente
    (`forbidden` em 401 e 403) distingue-se pelo status. Método não declarado numa rota dá `405 validation_failed` com
    `fields: ["method"]`; caminho desconhecido, em qualquer método e sem exigir a chave, dá `404 not_found`. Um `5xx`
    não diz se uma escrita ocorreu: o painel só repete escrita com `Idempotency-Key` (rotas de escrita, B3 em diante).

    **Escritas de formulário.** Toda escrita leva `expected_version` (a `version` que a leitura devolveu): versão velha dá
    `409 conflict` com `error.current_version`. O usuário vem sempre da sessão e o servidor, do caminho; um `user_id` ou
    `guild_id` no corpo é ignorado. A escrita num servidor reautoriza o usuário na hora (sem cache); a leitura aceita o
    cache de 30 s. Servidor negado e inexistente dão o mesmo `404`. Chave desconhecida fora de `values` é ignorada; dentro
    de `values`, campo desconhecido, que falta ou de tipo errado dá `400 validation_failed` com os nomes em `fields`.
    Nenhuma resposta traz segredo: o token do app de RPC sai só ao gerar (`PATCH /account/rpc`, `no-store`) e a chave de
    sessão do Last.fm nunca sai.

    **Versão.** Dentro da v1 só mudam coisas de forma aditiva; uma quebra vira `/api/v2` lado a lado por 6 meses, com
    `Deprecation` e `Sunset`.
  license:
    name: GNU General Public License v2.0 only
    identifier: GPL-2.0-only
servers:
  - url: "{origin}"
    description: Listener interno da API (EXTERNAL_PANEL_API_BIND e EXTERNAL_PANEL_API_PORT).
    variables:
      origin:
        default: http://127.0.0.1:6100
tags:
  - name: Meta
    description: Descoberta e saúde.
  - name: Sessão
    description: Login do usuário pelo OAuth do Discord, reautenticação e logout.
  - name: Conta
    description: Dados pessoais do usuário da sessão (prefixo, favoritos, integrações, Last.fm, token do RPC, rádios favoritas).
  - name: Servidores
    description: Servidores que o usuário gerencia.
  - name: Configurações
    description: Formulários de configuração de um servidor e exportação das playlists.
paths:
  /api/v1/meta:
    get:
      tags: [Meta]
      operationId: getMeta
      summary: Versões, versão do bot, client_id e redirect_uri do OAuth
      description: |
        O painel usa o `client_id` para montar o OAuth (com `state` e PKCE) e confere o `redirect_uri` esperado.
        `503 bot_unavailable` enquanto os bots não subiram e o `client_id` não resolve.
      security:
        - ServiceKey: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Metadados da API.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/KeyRejected"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Healthcheck do painel
      description: |
        **Sem chave**, só na porta interna, para o healthcheck do painel sem chave na linha de comando. O corpo é fixo e
        não traz mais nada. Não entra em nenhum limite.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: O bot responde.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/Unexpected"
  /api/v1/sessions:
    post:
      tags: [Sessão]
      operationId: createSession
      summary: Troca o code do Discord por uma sessão (login e reautenticação)
      description: |
        O **bot** troca o `code` com o `client_secret` (que nunca sai do bot), lê usuário e servidores, revoga o token do
        Discord e cria a sessão. O `redirect_uri` vem do ambiente do bot, nunca do corpo. O `session_token` aparece
        **só nesta resposta**; do outro lado o bot guarda apenas o SHA-256, preso à impressão da chave de serviço que o
        criou. As sessões vivem em memória: reiniciar o bot dá `401 session_expired` e novo login.

        **Reautenticação** (`reauth: true`, login recente): exige um `X-EM-Session` válido; o usuário do `code` tem de ser
        o da sessão (senão `403 reauth_user_mismatch` e nada muda). Nunca renova no lugar: o bot emite um token novo e
        **destrói o antigo**. Sem sessão válida, `reauth` dá `401 session_expired`.

        Usuário banido pelo dono recebe `403 forbidden` sem motivo (o token do Discord é revogado do mesmo jeito); com a
        lista de banidos ainda não carregada o login fica fechado em `503 bot_unavailable`. Um `code` recusado pelo
        Discord (inválido, já usado ou vencido) é `400 validation_failed` com `fields: ["code"]`; falha ao falar com o
        Discord é `502 discord_unavailable`. Esta rota também gasta o balde de criação de sessões (120 por minuto por
        chave).
      security:
        - ServiceKey: []
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: X-EM-Session
          in: header
          required: false
          description: "Só com `reauth: true`. Um token ausente ou inválido é ignorado nesta rota (e `reauth` o recusa)."
          schema:
            $ref: "#/components/schemas/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Sessão criada.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: |
            Corpo, tipo ou campo inválido (`fields` nomeia, em ordem: `code`, `code_verifier`, `reauth`), JSON que não é
            objeto, ou `code` recusado pelo Discord (`fields: ["code"]`).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidationFailed"
        "401":
          description: |
            `forbidden`: chave de serviço ausente, errada ou vencida (para o painel é erro de configuração, nunca erro do
            usuário). `session_expired`: `reauth` sem sessão válida, ou a sessão morreu durante a troca com o Discord.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorized"
        "403":
          description: |
            `reauth_user_mismatch`: o usuário do `code` não é o da sessão. `forbidden`: usuário banido pelo dono.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorForbidden"
        "415":
          description: "`Content-Type` diferente de `application/json` (`fields: [\"content_type\"]`)."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "502":
          description: Falha ao falar com o Discord (troca do código ou leitura do usuário e dos servidores).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDiscordUnavailable"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/session:
    get:
      tags: [Sessão]
      operationId: getSession
      summary: Dados da sessão atual
      description: |
        Devolve usuário, servidores (pré-filtro: só onde o usuário é dono, administrador ou tem Gerenciar Servidor) e as
        datas, **sem** o `session_token`. A cada requisição o bot confere o banimento do usuário: banido perde todas as
        sessões e recebe `401 session_expired`. `expires_at` é o fim absoluto (TTL); a ociosidade pode encerrar antes.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: A sessão.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
    delete:
      tags: [Sessão]
      operationId: deleteSession
      summary: Encerra a sessão atual (logout)
      description: |
        Repetir dá `401 session_expired`, que o painel ignora ao sair. A escrita gasta o balde de escrita do usuário
        (20 por minuto).
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "204":
          description: Sessão encerrada, sem corpo.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
  /api/v1/account:
    get:
      tags:
        - Conta
      operationId: getAccount
      summary: Todas as seções da conta do usuário da sessão
      description: |
        Prefixo pessoal, favoritos, rádios favoritas, integrações, Last.fm e token do app de RPC, uma entrada por chave de formulário. Só os dados do usuário da sessão; nenhum segredo sai (a chave de sessão do Last.fm e o token do RPC guardado nunca aparecem: só `vinculada` e `configurado`).
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: As seções.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountForms"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/account/prefix:
    patch:
      tags:
        - Conta
      operationId: setAccountPrefix
      summary: Prefixo pessoal
      description: |
        Troca o prefixo pessoal (vazio remove). Com `expected_version` velho a resposta é `409` com a versão atual.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPrefixWrite"
      responses:
        "200":
          description: O prefixo salvo.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPrefixForm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/account/rpc:
    patch:
      tags:
        - Conta
      operationId: issueRpcToken
      summary: Gera um token novo do app de RPC
      description: |
        O token novo aparece **só nesta resposta** (`Cache-Control: no-store`); o bot nunca o devolve de novo nem o registra. Por isso a rota **ignora** `Idempotency-Key`: o bot não guarda a resposta para repetir. O token antigo nunca sai. `403 forbidden` quando o token do RPC não está disponível neste bot.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRpcWrite"
      responses:
        "200":
          description: O token novo, uma só vez.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRpcIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/account/integrations:
    patch:
      tags:
        - Conta
      operationId: updateAccountIntegrations
      summary: Remove ou importa integrações pessoais
      description: |
        `action: remove` tira uma integração pelo título; `action: import` mescla as do JSON de exportação do bot: as novas entram e uma com o mesmo título (sem diferenciar maiúsculas) é substituída; respeita o limite (a substituída não ocupa vaga).
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountIntegrationsWrite"
      responses:
        "200":
          description: A seção atualizada.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountIntegrationsForm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/account/lastfm:
    patch:
      tags:
        - Conta
      operationId: setLastFmScrobble
      summary: Liga ou desliga o scrobble do Last.fm
      description: |
        Só o scrobble. O vínculo com o Last.fm **não** existe na v1 (continua pelo Discord); sem conta vinculada a resposta é `400 validation_failed`. A chave de sessão do Last.fm nunca sai.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountLastFmWrite"
      responses:
        "200":
          description: A seção atualizada.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLastFmForm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/account/favorites:
    get:
      tags:
        - Conta
      operationId: getFavorites
      summary: Favoritos pessoais
      description: |
        A seção de favoritos, com a contagem e o limite.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: A seção.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFavoritesForm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
    put:
      tags:
        - Conta
      operationId: writeFavorites
      summary: Adiciona, edita ou importa favoritos
      description: |
        `add` (nome novo), `edit` (troca o endereço de um nome existente) e `import` (JSON no formato de exportação, mesclado: os nomes novos entram e um nome já existente, sem diferenciar maiúsculas, tem o endereço substituído). Respeita o limite do usuário (a substituição não ocupa vaga).
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountFavoritesWrite"
      responses:
        "200":
          description: A seção atualizada.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFavoritesForm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
