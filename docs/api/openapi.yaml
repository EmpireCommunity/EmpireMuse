        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
    post:
      tags:
        - Rádios
      operationId: createRadioStation
      summary: "Cria uma estação personalizada"
      description: |
        Exige premium. Sem versão: o nome é único no servidor (idempotência natural). Uma fonte só, conforme `kind`: `artists` (até 10) ou `playlists` (até 5, existentes). O 11º dá `400` com `limit` em `fields`.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/GuildId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomStationWrite"
      responses:
        "201":
          description: "A estação criada."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomStation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/guilds/{guild_id}/radio-stations/{station_id}:
    put:
      tags:
        - Rádios
      operationId: writeCustomStation
      summary: "Edita uma estação personalizada"
      description: |
        Substituição, com `expected_version` (CAS em `rev`). Os valores de `name` e `source` são os guardados (os que a leitura devolve em `name`/`source`), nunca os de `display`. A estação é sempre do servidor do caminho; de outro dá `404`.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/GuildId"
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomStationEdit"
      responses:
        "200":
          description: "A estação salva."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomStation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
    delete:
      tags:
        - Rádios
      operationId: deleteRadioStation
      summary: "Apaga uma estação personalizada"
      description: |
        `expected_version` na query, conferida primeiro (versão velha dá `409` com `current_version`, mesmo em uso). Uma estação em uso por alguma rádio é recusada (`400` com `in_use` em `fields`).
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/GuildId"
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/ExpectedRev"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: "Apagada."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAction"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
components:
  securitySchemes:
    ServiceKey:
      type: http
      scheme: bearer
      description: Chave de serviço do painel (`EXTERNAL_PANEL_API_SECRET`). A chave anterior vale até o fim do dia UTC de `EXTERNAL_PANEL_API_PREVIOUS_UNTIL`.
    SessionToken:
      type: apiKey
      in: header
      name: X-EM-Session
      description: Token de sessão (256 bits, opaco) emitido por `POST /api/v1/sessions`, preso à chave que o criou.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Id de correlação do painel, ecoado na resposta e no envelope de erro.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,64}$"
    SessionToken:
      name: X-EM-Session
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/SessionToken"
    GuildId:
      name: guild_id
      in: path
      required: true
      description: ID do servidor no Discord. Fora desse formato a rota nem existe (`404`).
      schema:
        type: string
        pattern: ^[0-9]{1,20}$
    Category:
      name: category
      in: path
      required: true
      schema:
        type: string
        enum:
          - player
          - dj
          - appearance
          - links
          - general
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Torna a escrita repetível: a mesma chave com o mesmo pedido (usuário, servidor, rota e corpo) devolve a resposta de sucesso guardada, com `Idempotent-Replayed: true`, por 10 minutos (até 100 chaves por usuário). A mesma chave com outro pedido, ou com o original ainda em andamento, é `409 conflict`. Só sucesso é guardado: um erro libera a chave. Um `5xx` não diz se a escrita ocorreu; repita com a mesma chave **e** com `expected_version` (a versão impede gravar duas vezes). Fora do formato é `400` com `fields: ["idempotency_key"]`.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,64}$
    FavoriteName:
      name: name
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ExpectedVersionQuery:
      name: expected_version
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Version"
    RadioKind:
      name: kind
      in: query
      required: true
      schema:
        type: string
        enum:
          - station
          - filter
    RadioTarget:
      name: id
      in: query
      required: true
      description: O `uuid` da estação ou o `node` do local (os mesmos de `GET /account/radio-favorites`).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LinksScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum:
          - jukebox
          - radio
    RadioId:
      name: radio_id
      in: path
      required: true
      description: "O id da rádio, `<bot>:<servidor>`. Tem de terminar com o `guild_id` do caminho; senão `404`."
      schema:
        type: string
        pattern: ^[0-9]{1,20}:[0-9]{1,20}$
    StationId:
      name: station_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    TaskId:
      name: task_id
      in: path
      required: true
      description: O id que `POST …/jukebox/tasks` devolveu (32 caracteres). Fora desse formato a rota nem existe (`404`).
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{32}$
    ExpectedRev:
      name: expected_version
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/RevVersion"
    SearchTerm:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 200
    LocalNode:
      name: node
      in: query
      required: false
      description: O id de um nó da árvore de local (o `id` de uma opção de `levels`). Parâmetro repetido é `400`.
      schema:
        type: string
        maxLength: 100
    LocalPage:
      name: pagina
      in: query
      required: false
      description: A página das estações do nó final (24 por página; a última se passar).
      schema:
        type: string
        pattern: ^[0-9]{1,4}$
  headers:
    CacheControl:
      required: true
      description: Sempre `no-store`.
      schema:
        const: no-store
    ContentTypeOptions:
      required: true
      description: Sempre `nosniff`.
      schema:
        const: nosniff
    RequestIdOut:
      required: true
      description: Id de correlação (o do painel, se tiver formato seguro; senão gerado pelo bot).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,64}$"
    RetryAfter:
      required: true
      description: Segundos até tentar de novo.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      required: false
      description: "`true` quando a resposta é a guardada de uma tentativa anterior com a mesma `Idempotency-Key`."
      schema:
        const: "true"
  responses:
    KeyRejected:
      description: |
        Chave de serviço ausente, errada ou vencida (`forbidden`). Para o painel é erro de configuração, nunca erro do
        usuário.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorForbidden"
    Unauthorized:
      description: |
        `forbidden`: chave de serviço ausente, errada ou vencida. `session_expired`: `X-EM-Session` ausente, inválido,
        expirado, de outra chave, ou usuário banido. `reauth_required`: login com mais de 30 minutos, nas rotas de apagar dados.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorUnauthorized"
    RateLimited:
      description: |
        Limite excedido (`rate_limited`) com `Retry-After` em segundos. Limites em memória: leitura 120 e escrita 20 por
        minuto por usuário, 600 por minuto por chave, 120 logins por minuto por chave; mais de 30 falhas de chave por
        minuto num par TCP bloqueiam esse par **só para chave errada** (a chave certa sempre passa).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRateLimited"
    Unexpected:
      description: |
        Erro inesperado (`bot_unavailable`), sem rastreio no corpo; o `request_id` liga ao log do bot. Não diz se uma
        escrita ocorreu.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBotUnavailable"
    NotReady:
      description: O bot ainda não está pronto (bots não subiram, lista de banidos não carregada); tente de novo.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBotUnavailable"
    BadRequest:
      description: "`validation_failed`: corpo, tipo ou campo inválido; `fields` nomeia o que falhou (nunca o texto de erro)."
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorValidationFailed"
    UnsupportedMedia:
      description: '`415 validation_failed` com `fields: ["content_type"]`: o corpo exige `Content-Type: application/json`.'
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorValidationFailed"
    ForbiddenAction:
      description: '`forbidden`: o usuário gerencia o servidor, mas não tem a permissão específica desta ação, ou o recurso não
        está disponível neste bot.'
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorForbidden"
    NotFound:
      description: "`not_found`. Servidor negado e inexistente dão o mesmo `404`, sem dizer qual dos dois."
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorNotFound"
    Conflict:
      description: '`conflict`. Versão velha: traz `current_version` (a versão que o formulário tem agora). Também `Idempotency-Key`
        já usada com outro pedido ou ainda em andamento (sem `current_version`).'
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        X-Request-ID:
          $ref: "#/components/headers/RequestIdOut"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorConflict"
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [api_versions, bot_version, client_id, redirect_uri, features]
      properties:
        api_versions:
          type: array
          items:
            type: string
            pattern: "^v[0-9]+$"
          examples: [["v1"]]
        bot_version:
          type: string
          examples: ["2.4.0"]
        client_id:
          type: string
          description: ID do aplicativo do Discord usado no OAuth do painel.
          pattern: "^[0-9]{1,20}$"
        redirect_uri:
          type: string
          description: "`EXTERNAL_PANEL_URL` + `/auth/callback`, o único `redirect_uri` aceito. A URL pode levar um prefixo de caminho (`https://muse.example.com/panel` dá `https://muse.example.com/panel/auth/callback`)."
          examples:
            - "https://painel.example.com/auth/callback"
            - "https://muse.example.com/panel/auth/callback"
        features:
          type: array
          description: Recursos ativos nesta versão da API; cresce de forma aditiva.
          items:
            type: string
          examples: [["sessions", "reauth"]]
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    SessionToken:
      type: string
      description: 256 bits em base64 urlsafe, sem preenchimento.
      pattern: "^[A-Za-z0-9_-]{43}$"
    SessionCreate:
      type: object
      required: [code, code_verifier]
      properties:
        code:
          type: string
          description: Código do OAuth do Discord (ASCII, uso único).
          minLength: 1
          maxLength: 512
          pattern: "^[\\x00-\\x7F]+$"
        code_verifier:
          type: string
          description: PKCE (RFC 7636), o mesmo que gerou o `code_challenge` do painel.
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
        reauth:
          type: boolean
          default: false
          description: Reautenticação; exige `X-EM-Session` válido e troca o token.
    SessionInfo:
      type: object
      additionalProperties: false
      required: [user, guilds, expires_at, authenticated_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        guilds:
          type: array
          items:
            $ref: "#/components/schemas/Guild"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        authenticated_at:
          $ref: "#/components/schemas/Timestamp"
    SessionCreated:
      description: Igual à sessão, mais o `session_token` (devolvido uma única vez).
      type: object
      additionalProperties: false
      required: [session_token, user, guilds, expires_at, authenticated_at]
      properties:
        session_token:
          $ref: "#/components/schemas/SessionToken"
        user:
          $ref: "#/components/schemas/User"
        guilds:
          type: array
          items:
            $ref: "#/components/schemas/Guild"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        authenticated_at:
          $ref: "#/components/schemas/Timestamp"
    User:
      type: object
      additionalProperties: false
      required: [id, username, global_name, avatar]
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        username:
          type: string
          minLength: 1
        global_name:
          type: [string, "null"]
        avatar:
          type: [string, "null"]
          description: Hash do avatar no Discord.
    Guild:
      type: object
      additionalProperties: false
      required: [id, name, icon, owner, permissions]
      properties:
        id:
          type: string
          pattern: "^[0-9]{1,20}$"
        name:
          type: string
        icon:
          type: [string, "null"]
        owner:
          type: boolean
        permissions:
          type: string
          description: Inteiro de permissões do Discord **como texto** (o valor passa de 2^53).
          pattern: "^[0-9]+$"
    Timestamp:
      type: string
      description: ISO 8601 em UTC com `Z`, em segundos.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
      examples: ["2026-11-11T12:00:00Z"]
    ErrorCode:
      type: string
      description: Código estável. O status HTTP acompanha a situação; o `code` é a chave.
      enum:
        - validation_failed
        - conflict
        - forbidden
        - not_found
        - rate_limited
        - reauth_required
        - reauth_user_mismatch
        - session_expired
        - discord_unavailable
        - bot_unavailable
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            fields:
              type: array
              description: "Só em `validation_failed`: nomes dos campos (ou `method` e `content_type`) que falharam."
              items:
                type: string
            current_version:
              type: string
              description: "Só em `409 conflict` de versão: a versão que o formulário (16 hexadecimais) ou a rádio e a estação (`rev` decimal) têm agora."
              pattern: "^([0-9a-f]{16}|[0-9]{1,12})$"
            request_id:
              type: string
              description: Liga a resposta ao log do bot; o mesmo valor vai no cabeçalho `X-Request-ID`.
              pattern: "^[A-Za-z0-9_-]{8,64}$"
    # Variantes por código e status: o cliente gerado distingue pelo status e pelo `code`.
    ErrorValidationFailed:
      description: "`validation_failed`, com `fields` quando se sabe qual campo falhou."
      $ref: "#/components/schemas/Error"
    ErrorUnauthorized:
      description: "`forbidden` (chave), `session_expired` ou `reauth_required`."
      $ref: "#/components/schemas/Error"
    ErrorForbidden:
      description: "`forbidden` ou `reauth_user_mismatch`."
      $ref: "#/components/schemas/Error"
    ErrorRateLimited:
      description: "`rate_limited`."
      $ref: "#/components/schemas/Error"
    ErrorDiscordUnavailable:
      description: "`discord_unavailable`."
      $ref: "#/components/schemas/Error"
    ErrorBotUnavailable:
      description: "`bot_unavailable`."
      $ref: "#/components/schemas/Error"
    Version:
      type: string
      description: "A versão de um formulário (16 hexadecimais): a que a escrita seguinte envia em `expected_version`."
      pattern: ^[0-9a-f]{16}$
    PlayerValues:
      type: object
      additionalProperties: false
      required:
        - default_player_volume
        - autoplay
        - check_other_bots_in_vc
        - enable_restrict_mode
      properties:
        default_player_volume:
          type: integer
        autoplay:
          type: boolean
        check_other_bots_in_vc:
          type: boolean
        enable_restrict_mode:
          type: boolean
    PlayerExtras:
      type: object
      additionalProperties: false
      required:
        - volumes
      properties:
        volumes:
          type: array
          items:
            type: integer
    DjValues:
      type: object
      additionalProperties: false
      required:
        - djroles
      properties:
        djroles:
          type: array
          items:
            type: string
    DjExtras:
      type: object
      additionalProperties: false
      required:
        - cargos
      properties:
        cargos:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
    GuildPrefixValues:
      type: object
      additionalProperties: false
      required:
        - prefix
      properties:
        prefix:
          type: string
    VoiceStatusValues:
      type: object
      additionalProperties: false
      required:
        - voice_status_permanent
        - voice_channel_status
      properties:
        voice_status_permanent:
          type: boolean
        voice_channel_status:
          type: string
    VoiceStatusExtras:
      type: object
      additionalProperties: false
