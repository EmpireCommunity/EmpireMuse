                    - "null"
                player_skin_static:
                  type:
                    - string
                    - "null"
        - type: object
          required:
            - expected_version
            - values
            - form
            - action
          properties:
            form:
              const: ouvir_junto
            expected_version:
              $ref: "#/components/schemas/Version"
            values:
              type: object
              additionalProperties: false
              required:
                - canal
              properties:
                canal:
                  type: string
            action:
              const: remove
        - type: object
          required:
            - expected_version
            - action
            - scope
            - values
          properties:
            form:
              const: links
            expected_version:
              $ref: "#/components/schemas/Version"
            action:
              enum:
                - add
                - edit
                - remove
                - import
            scope:
              type: string
              enum:
                - jukebox
                - radio
            values:
              type: object
              additionalProperties: false
              properties:
                nome:
                  type: string
                url:
                  type: string
                descricao:
                  type: string
                generos:
                  type: array
                  items:
                    type: string
                icone:
                  type:
                    - string
                    - "null"
                ordem:
                  type:
                    - integer
                    - "null"
                alvo:
                  type: string
                dados:
                  type:
                    - object
                    - array
              description: '`add`: `nome` e `url` (os outros opcionais). `edit`: o mesmo mais `alvo` (o nome atual). `remove`:
                só `alvo`. `import`: só `dados` (o arquivo de importação).'
    RevVersion:
      type: string
      description: "A versão de uma rádio ou de uma estação do servidor: o `rev` decimal do documento (1 a 12 dígitos), que a escrita seguinte envia em `expected_version`. **Não** é o hexadecimal dos formulários de configuração."
      pattern: ^[0-9]{1,12}$
    EmptyObject:
      type: object
      additionalProperties: false
    JukeboxOptionsValues:
      type: object
      additionalProperties: false
      required: [jukebox_auto_delete, jukebox_text_requests]
      properties:
        jukebox_auto_delete:
          type: boolean
        jukebox_text_requests:
          type: boolean
    JukeboxOptionsForm:
      type: object
      additionalProperties: false
      required: [key, version, values, extras]
      properties:
        key:
          const: opcoes
        version:
          $ref: "#/components/schemas/Version"
        values:
          $ref: "#/components/schemas/JukeboxOptionsValues"
        extras:
          type: object
          additionalProperties: false
          maxProperties: 0
    JukeboxOptionsWrite:
      type: object
      required: [expected_version, values]
      properties:
        expected_version:
          $ref: "#/components/schemas/Version"
        values:
          $ref: "#/components/schemas/JukeboxOptionsValues"
    JukeboxTaskKind:
      type: string
      enum: [configure, reset]
    JukeboxTaskState:
      type: string
      description: "`pendente`, `executando`, `ok` ou `erro`; só `ok` e `erro` são finais."
      enum: [pendente, executando, ok, erro]
    JukeboxTask:
      type: object
      additionalProperties: false
      required: [task_id, kind, state, final]
      properties:
        task_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{32}$
        kind:
          $ref: "#/components/schemas/JukeboxTaskKind"
        state:
          $ref: "#/components/schemas/JukeboxTaskState"
        final:
          type: boolean
    JukeboxTaskAccepted:
      type: object
      additionalProperties: false
      required: [task_id, state]
      properties:
        task_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{32}$
        state:
          $ref: "#/components/schemas/JukeboxTaskState"
    JukeboxConfirmation:
      type: object
      additionalProperties: false
      required: [requires_confirmation, confirm_token]
      properties:
        requires_confirmation:
          const: true
        confirm_token:
          type: string
          description: Vale 60 s e uma vez só; preso a usuário, servidor, finalidade e canal. Repita o pedido com ele em `confirm_token`.
          maxLength: 400
    JukeboxConfigureValues:
      type: object
      additionalProperties: false
      required: [modo]
      properties:
        modo:
          type: string
          enum: [existente, criar]
        canal:
          type: string
          description: "`existente`: o id de um canal de texto, voz, palco ou fórum do servidor."
        titulo_forum:
          type: string
          description: Só em fórum (o título do post).
        tipo:
          type: string
          description: "`criar`: `texto`, `voz` ou `palco`."
        categoria:
          type: string
          description: "`criar`: o id da categoria (vazio = sem categoria)."
    JukeboxTaskWrite:
      description: "`configure` (com `values`) ou `reset` (sem `values`); `confirm_token` só no passo 2."
      oneOf:
        - type: object
          required: [expected_version, action, values]
          properties:
            expected_version:
              $ref: "#/components/schemas/Version"
            action:
              const: configure
            values:
              $ref: "#/components/schemas/JukeboxConfigureValues"
            confirm_token:
              type: [string, "null"]
              maxLength: 400
        - type: object
          required: [expected_version, action]
          properties:
            expected_version:
              $ref: "#/components/schemas/Version"
            action:
              const: reset
            confirm_token:
              type: [string, "null"]
              maxLength: 400
    JukeboxChoices:
      type: object
      additionalProperties: false
      required: [channels, types, categories]
      properties:
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, channels]
            properties:
              category:
                type: [string, "null"]
              channels:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name, type]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                      enum: [texto, voz, palco, forum]
        types:
          type: array
          items:
            type: string
            enum: [texto, voz, palco]
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
    JukeboxState:
      type: object
      additionalProperties: false
      required: [version, configured, channel, panel_bot, options, choices, task]
      properties:
        version:
          $ref: "#/components/schemas/Version"
        configured:
          type: boolean
        channel:
          type: [object, "null"]
          additionalProperties: false
          required: [id, name, missing]
          properties:
            id:
              type: string
            name:
              type: [string, "null"]
            missing:
              type: boolean
              description: O canal configurado já não existe no servidor.
        panel_bot:
          type: [string, "null"]
          description: O nome do bot que envia o painel e atende o canal.
        options:
          $ref: "#/components/schemas/JukeboxOptionsForm"
        choices:
          $ref: "#/components/schemas/JukeboxChoices"
        task:
          description: A tarefa em andamento do próprio usuário neste servidor, ou `null`.
          oneOf:
            - $ref: "#/components/schemas/JukeboxTask"
            - type: "null"
    DirectoryStation:
      type: object
      additionalProperties: false
      required: [uuid, name, country, codec, bitrate, unavailable]
      description: Uma estação do diretório. A URL do fluxo e a do logo nunca saem (use `GET …/radios/{radio_id}/logo`).
      properties:
        uuid:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        name:
          type: [string, "null"]
          description: "`null` se o diretório não respondeu ou não conhece o `uuid`."
        country:
          type: [string, "null"]
        codec:
          type: [string, "null"]
        bitrate:
          type: integer
        unavailable:
          type: boolean
    RadioChat:
      type: object
      additionalProperties: false
      required: [voice_delete_after_s, stage_max_messages, stage_max_age_s]
      properties:
        voice_delete_after_s:
          type: integer
        stage_max_messages:
          type: integer
        stage_max_age_s:
          type: integer
    Radio:
      type: object
      additionalProperties: false
      required: [id, kind, enabled, state, version, bot, channel, title, can_edit, chat, source]
      properties:
        id:
          type: string
          pattern: ^[0-9]{1,20}:[0-9]{1,20}$
        kind:
          type: string
          enum: [live, custom]
        enabled:
          type: boolean
        state:
          type: string
          enum: [desligada, pausada_dono, fora_do_ar, reserva, tocando, pausada]
        version:
          $ref: "#/components/schemas/RevVersion"
        bot:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: [string, "null"]
              description: "`null` se o bot não está conectado neste servidor."
        channel:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: [string, "null"]
        title:
          type: [string, "null"]
          description: O que toca agora (já sem menção nem link vivos).
        can_edit:
          type: boolean
          description: Premium **e** Gerenciar Mensagens no canal da rádio.
        chat:
          $ref: "#/components/schemas/RadioChat"
        source:
          type: object
          additionalProperties: false
          required: [station, reserve]
          properties:
            station:
              type: [string, "null"]
            reserve:
              type: [string, "null"]
        stations:
          type: object
          description: Só em rádio `live` de servidor com premium.
          additionalProperties: false
          required: [main, reserve]
          properties:
            main:
              oneOf:
                - $ref: "#/components/schemas/DirectoryStation"
                - type: "null"
            reserve:
              oneOf:
                - $ref: "#/components/schemas/DirectoryStation"
                - type: "null"
    RadioSetupOptions:
      type: object
      additionalProperties: false
      required: [bots, channels]
      properties:
        bots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, kind]
            properties:
              id:
                type: string
              name:
                type: string
              kind:
                type: string
                enum: [voice, stage]
    RadioList:
      type: object
      additionalProperties: false
      required: [premium, max_radios, radios]
      properties:
        premium:
          type: boolean
        max_radios:
          type: integer
        radios:
          type: array
          items:
            $ref: "#/components/schemas/Radio"
        setup:
          $ref: "#/components/schemas/RadioSetupOptions"
    RadioSetupValues:
      type: object
      additionalProperties: false
      required: [kind, channel_id, bot_id]
      properties:
        kind:
          type: string
          enum: [live, custom]
        channel_id:
          type: string
          pattern: ^[0-9]{1,20}$
        bot_id:
          type: string
          pattern: ^[0-9]{1,20}$
    RadioCreate:
      type: object
      required: [values]
      properties:
        values:
          $ref: "#/components/schemas/RadioSetupValues"
    RadioSetupWrite:
      type: object
      required: [expected_version, values]
      properties:
        expected_version:
          $ref: "#/components/schemas/RevVersion"
        values:
          $ref: "#/components/schemas/RadioSetupValues"
    RadioChatWrite:
      type: object
      required: [expected_version, values]
      properties:
        expected_version:
          $ref: "#/components/schemas/RevVersion"
        values:
          $ref: "#/components/schemas/RadioChat"
    RadioStationWrite:
      type: object
      required: [expected_version, values]
      properties:
        expected_version:
          $ref: "#/components/schemas/RevVersion"
        values:
          type: object
          additionalProperties: false
          required: [estacao]
          properties:
            estacao:
              type: string
              description: "`live`: o `uuid` da estação. `custom`: o id de uma estação do servidor ou `g:<gênero>`."
            node:
              type: string
              description: O nó da cascata de onde a estação foi escolhida (opcional).
    RadioReserveWrite:
      type: object
      required: [expected_version, values]
      properties:
        expected_version:
          $ref: "#/components/schemas/RevVersion"
        values:
          type: object
          additionalProperties: false
          required: [reserva]
          properties:
            reserva:
              type: [string, "null"]
    RadioStationSearch:
      type: object
      additionalProperties: false
      required: [stations]
      properties:
        stations:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryStation"
    RadioLocal:
      type: object
      additionalProperties: false
      required: [node, final, levels, stations, paging]
      properties:
        node:
          type: [string, "null"]
        final:
          type: boolean
        levels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [depth, parent, selected, options]
            properties:
              depth:
                type: integer
              parent:
                type: [string, "null"]
              selected:
                type: [string, "null"]
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, label, description, count]
                  properties:
                    id:
                      type: string
                    label:
                      type: [string, "null"]
                    description:
                      type: [string, "null"]
                    count:
                      type: integer
        stations:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryStation"
        paging:
          type: [object, "null"]
          additionalProperties: false
          required: [node, page, pages]
          properties:
            node:
              type: string
            page:
              type: integer
            pages:
              type: integer
    RadioResetPrepared:
      type: object
      additionalProperties: false
      required: [confirm_token, expires_in, radio]
      properties:
        confirm_token:
          type: string
          maxLength: 400
        expires_in:
          type: integer
          description: Segundos de validade (60).
        radio:
          type: object
          additionalProperties: false
          required: [id, kind, enabled]
          properties:
            id:
              type: string
            kind:
              type: string
              enum: [live, custom]
            enabled:
              type: boolean
    RadioResetWrite:
      type: object
      required: [confirm_token]
      properties:
        confirm_token:
          type: string
          maxLength: 400
    CustomStationValues:
      description: "Uma fonte só, conforme `kind`: `artists` exige `artists`; `playlists` exige `playlists`."
      oneOf:
        - $ref: "#/components/schemas/CustomStationArtistsValues"
        - $ref: "#/components/schemas/CustomStationPlaylistsValues"
      discriminator:
        propertyName: kind
        mapping:
          artists: "#/components/schemas/CustomStationArtistsValues"
          playlists: "#/components/schemas/CustomStationPlaylistsValues"
    CustomStationArtistsValues:
      type: object
      additionalProperties: false
      required: [name, kind, artists]
      properties:
        name:
          type: string
          description: De 1 a 32 caracteres, único no servidor.
        kind:
          type: string
          const: artists
          description: Só `artists` e `playlists` se criam e se editam; `genre` existe apenas na leitura (estação legada).
        artists:
          type: array
          description: "De 1 a 10 nomes."
          minItems: 1
          maxItems: 10
          items:
            type: string
    CustomStationPlaylistsValues:
      type: object
      additionalProperties: false
      required: [name, kind, playlists]
      properties:
        name:
          type: string
          description: De 1 a 32 caracteres, único no servidor.
        kind:
          type: string
          const: playlists
          description: Só `artists` e `playlists` se criam e se editam; `genre` existe apenas na leitura (estação legada).
        playlists:
          type: array
          description: "De 1 a 5 playlists de rádio do servidor."
          minItems: 1
          maxItems: 5
          items:
            type: string
    CustomStationWrite:
      description: "Criar leva só `values`."
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          $ref: "#/components/schemas/CustomStationValues"
    CustomStationEdit:
      description: "Editar leva `values` e a versão lida (`expected_version`, obrigatória)."
      type: object
      additionalProperties: false
      required: [values, expected_version]
      properties:
        expected_version:
          $ref: "#/components/schemas/RevVersion"
        values:
          $ref: "#/components/schemas/CustomStationValues"
    CustomStation:
      type: object
      additionalProperties: false
      required: [id, name, kind, display, source, unknown, in_use, version]
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{24}$
        name:
          type: [string, "null"]
          description: O valor guardado (o que a edição devolve). Para exibir use `display.name`.
        kind:
          type: string
          enum: [genre, artists, playlists]
        display:
          type: object
          description: Os mesmos textos já tratados para exibição (sem menção nem link vivos). Nunca os envie de volta numa escrita.
          additionalProperties: false
          required: [name, source]
          properties:
            name:
              type: [string, "null"]
            source:
              type: object
              additionalProperties: false
              properties:
                genre:
                  type: string
                artists:
                  type: array
                  items:
                    type: string
                playlists:
                  type: array
                  items:
                    type: string
        source:
          type: object
          additionalProperties: false
          properties:
            genre:
              type: string
            artists:
              type: array
              items:
                type: string
            playlists:
              type: array
              items:
                type: string
        unknown:
          type: array
          description: Artistas que o Last.fm não achou.
          items:
            type: string
        in_use:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [radio_id, channel_name]
            properties:
              radio_id:
                type: string
              channel_name:
                type: string
        version:
          $ref: "#/components/schemas/RevVersion"
    CustomStationList:
      type: object
      additionalProperties: false
      required: [stations, total, max, genres, playlists, playlists_display]
      properties:
        stations:
          type: array
          items:
            $ref: "#/components/schemas/CustomStation"
        total:
          type: integer
        max:
          type: integer
        genres:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group, genres]
            properties:
              group:
                type: string
              genres:
                type: array
                items:
                  type: string
        playlists:
          type: array
          description: Os nomes como estão guardados (a identidade que a escrita compara).
          items:
            type: string
        playlists_display:
          type: array
          description: Os mesmos nomes, na mesma ordem, tratados para exibição.
          items:
            type: string
