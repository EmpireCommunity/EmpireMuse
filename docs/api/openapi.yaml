  /api/v1/guilds/{guild_id}/jukebox/tasks:
    post:
      tags:
        - Jukebox
      operationId: startJukeboxTask
      summary: "Configura ou reinicia a Jukebox"
      description: |
        `action: configure` (com `values`) ou `reset`. Configurar num **canal existente** limpa as mensagens dele e reiniciar apaga o painel: os dois pedem confirmação em **dois passos**. O passo 1 (sem `confirm_token`) não faz nada e devolve `200` com `requires_confirmation` e o `confirm_token`; o passo 2 repete o mesmo pedido **com** o token e devolve `202` com o `task_id`. O token é preso a usuário, servidor, finalidade e canal, vale 60 s e uma vez só. Criar um canal novo e usar um fórum não pedem confirmação (`202` direto). A `Idempotency-Key` vale no passo 2 e também em um `configure` que cria a tarefa direto (sem limpar canal): repetir devolve o mesmo `task_id` com `Idempotent-Replayed`. O passo 1 ignora a chave (cada pedido emite um token novo).
        Acompanhe por `GET …/tasks/{task_id}`. `409` com `current_version` se `expected_version` é velha; `409` sem `current_version` se já há uma tarefa no servidor; `429` se o usuário já tem 5 tarefas em andamento. `400` com `confirm_token` em `fields` para token inválido, vencido, usado ou de outro contexto.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
        - $ref: "#/components/parameters/GuildId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JukeboxTaskWrite"
      responses:
        "200":
          description: "Passo 1: a confirmação pedida (nada foi feito)."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JukeboxConfirmation"
        "202":
          description: "Passo 2: a tarefa foi aceita."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JukeboxTaskAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
