      summary: Os formulários de uma categoria
      description: |
        `player`, `dj`, `appearance`, `links` ou `general`. Cada formulário vem com a `version` que a escrita seguinte deve enviar em `expected_version`. Leitura aceita o cache de autorização de 30 s.
