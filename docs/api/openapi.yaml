  /api/v1/account/erasure:
    post:
      tags:
        - Conta
      operationId: eraseAccount
      summary: Apaga os dados do usuário da sessão
      description: |
        Confere o login recente (`401 reauth_required`), o `confirm_token` (expirado, já usado, de outra sessão, de outro usuário ou de
        outra finalidade = `400` com `fields: ["confirm_token"]`, sem distinguir o motivo) e a palavra digitada (`APAGAR` ou `DELETE`, exatas:
        sem ignorar maiúsculas nem espaços; qualquer outra = `400` com `fields: ["typed"]` e **o token não é gasto**; a tela escolhe a
        palavra pelo idioma da página e o bot aceita as duas em qualquer idioma). O alvo é sempre o usuário da sessão: um `user_id` no corpo
        não é lido. Chama o mesmo serviço de apagamento do comando do Discord, com os mesmos limites por hora (só `OK` conta nas 3 por
        usuário; teto global de 60 por hora): excedido dá `429` com `Retry-After` e nada é apagado.

        `status`: `OK` (nada sobrou), `PARTIAL` (parte apagada; **não promete que repetir resolve**: o painel mostra "apagamos
        parte" e aponta o suporte) ou `BUSY` (o serviço está ocupado; nada foi apagado). Com `OK` ou `PARTIAL` **todas** as sessões do
        usuário já foram destruídas, inclusive a deste pedido (o painel destrói a dele). O `confirm_token` é gasto antes da chamada:
        com `BUSY` ou `429` o painel pede outro `prepare`. A `Idempotency-Key` é ignorada. O corpo da resposta nunca traz contagens
        nem nomes de armazenamento.
      security:
        - ServiceKey: []
          SessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErasureRequest"
      responses:
        "200":
          description: O resultado da execução.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            X-Request-ID:
              $ref: "#/components/headers/RequestIdOut"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/NotReady"
