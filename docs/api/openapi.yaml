              const: skin_global
            expected_version:
              $ref: "#/components/schemas/Version"
            values:
              type: object
              additionalProperties: false
              required:
                - global_skin
                - player_skin
                - player_skin_static
              properties:
                global_skin:
                  type: boolean
                player_skin:
                  type:
                    - string
                    - "null"
                player_skin_static:
                  type:
                    - string
                    - "null"
        - type: object
          required:
            - expected_version
            - values
            - form
            - action
          properties:
            form:
              const: ouvir_junto
            expected_version:
              $ref: "#/components/schemas/Version"
            values:
              type: object
              additionalProperties: false
              required:
                - canal
              properties:
                canal:
                  type: string
            action:
