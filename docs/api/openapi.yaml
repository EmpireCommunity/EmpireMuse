          type: string
          description: Opaco, de uso único, preso a usuário, sessão e finalidade. Nunca vai para log.
          maxLength: 512
        expires_in:
          type: integer
          description: Segundos de validade (60).
        summary:
          type: object
          additionalProperties: false
          required: [erases, keeps, backups_up_to_weeks]
          properties:
            erases:
              type: array
              description: Códigos estáveis do que o apagamento remove (o texto é do painel).
              items:
                type: string
                enum: [preferences, lastfm_and_scrobbles, saved_queue, radio_favorites, radio_editor_ids, sessions]
            keeps:
              type: array
              description: Códigos estáveis do que fica.
              items:
                type: string
                enum: [access_and_security_logs, live_player_records, server_settings_and_statistics, lastfm_remote_data]
            backups_up_to_weeks:
              type: integer
              description: Cópias de segurança do provedor podem guardar dados já apagados por até tantas semanas.
