                - check_other_bots_in_vc
                - enable_restrict_mode
              properties:
                default_player_volume:
                  type: integer
                autoplay:
                  type: boolean
                check_other_bots_in_vc:
                  type: boolean
                enable_restrict_mode:
                  type: boolean
