      summary: Grava um formulário da categoria
      description: |
        Uma escrita é sempre uma **substituição**: todo campo do formulário vem em `values` (o checkbox desmarcado é `false`). `form` é obrigatório nas categorias com mais de um formulário (`appearance` e `general`) e opcional nas outras. A escrita **reautoriza o usuário na hora** (sem cache). `expected_version` velho dá `409` com `current_version`. `403 forbidden` quando falta a permissão específica da ação (remover convite de ouvir junto exige Gerenciar Canais). `400` traz em `fields` os nomes dos campos de `values` (ou `action`, `scope`, `form`, `expected_version`) que falharam.
      security:
