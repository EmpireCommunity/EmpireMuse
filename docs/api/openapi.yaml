      required:
        - bot_name
        - bot_avatar_url
        - url
      properties:
        bot_name:
          type: string
        bot_avatar_url:
          type: string
        url:
          type: string
    GuildEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - icon
        - owner
        - permissions
        - bot_present
        - invites
      properties:
        id:
          type: string
          pattern: ^[0-9]{1,20}$
        name:
          type: string
        icon:
          type:
            - string
            - "null"
        owner:
          type: boolean
        permissions:
          type: string
          pattern: ^[0-9]+$
        bot_present:
          type: boolean
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    GuildList:
      type: object
      additionalProperties: false
      required:
        - guilds
      properties:
        guilds:
          type: array
          items:
            $ref: "#/components/schemas/GuildEntry"
    GuildDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - icon_url
        - bots
        - invites
      properties:
        id:
          type: string
          pattern: ^[0-9]{1,20}$
        name:
          type: string
        icon_url:
          type:
            - string
            - "null"
        bots:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
              - avatar_url
            properties:
              id:
                type: string
              name:
                type: string
              avatar_url:
                type: string
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    FavoritesExport:
      type: object
      description: "`{nome: endereço}`, o formato de importação."
      additionalProperties:
        type: string
    LinksExport:
      type: object
      description: "`{playlists: [...]}`, o formato de importação (cada item leva `scope` quando a exportação é dos dois escopos)."
      required:
        - playlists
      properties:
        playlists:
          type: array
          items:
            type: object
    ErrorNotFound:
      description: "`not_found`."
      $ref: "#/components/schemas/Error"
    ErrorConflict:
      description: "`conflict`, com `current_version` quando a versão esperada é velha."
      $ref: "#/components/schemas/Error"
    ErasurePrepared:
      type: object
      additionalProperties: false
      required: [confirm_token, expires_in, summary]
      properties:
        confirm_token:
          type: string
          description: Opaco, de uso único, preso a usuário, sessão e finalidade. Nunca vai para log.
          maxLength: 512
        expires_in:
          type: integer
          description: Segundos de validade (60).
        summary:
          type: object
          additionalProperties: false
          required: [erases, keeps, backups_up_to_weeks, confirmation_word]
          properties:
            erases:
              type: array
              description: Códigos estáveis do que o apagamento remove (o texto é do painel).
              items:
                type: string
                enum: [preferences, lastfm_and_scrobbles, saved_queue, radio_favorites, radio_editor_ids, sessions]
            keeps:
              type: array
              description: Códigos estáveis do que fica.
              items:
                type: string
                enum: [access_and_security_logs, live_player_records, server_settings_and_statistics, lastfm_remote_data]
            backups_up_to_weeks:
              type: integer
              description: Cópias de segurança do provedor podem guardar dados já apagados por até tantas semanas.
            confirmation_word:
              type: string
              description: A palavra que o usuário digita em `typed`.
    ErasureRequest:
      type: object
      required: [confirm_token, typed]
      properties:
        confirm_token:
          type: string
          maxLength: 512
        typed:
          type: string
          description: A palavra de confirmação (`confirmation_word`), exata e em maiúsculas.
          maxLength: 64
    ErasureResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [OK, PARTIAL, BUSY]
