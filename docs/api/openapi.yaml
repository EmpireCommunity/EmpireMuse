      type: object
      required: [confirm_token, typed]
      properties:
        confirm_token:
          type: string
          maxLength: 512
        typed:
          type: string
          enum: [APAGAR, DELETE]
          description: |
            A palavra de confirmação, **exata** (sem ignorar maiúsculas nem espaços): `APAGAR` (painel em pt-BR) ou `DELETE` (en-US).
            O bot aceita as duas em qualquer idioma; qualquer outro valor é `400` com `fields: ["typed"]` e o `confirm_token` não é gasto.
