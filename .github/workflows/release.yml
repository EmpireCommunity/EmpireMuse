name: Release Docker

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verificar se tag pertence a origin/main
    runs-on: ubuntu-latest
    steps:
      - name: Validar o formato da tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag fora do formato vX.Y.Z[-rc.N]; nada é publicado."
            exit 1
          fi

      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar se a tag aponta para commit em origin/main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::A tag '${GITHUB_REF_NAME}' aponta para um commit que não pertence à branch origin/main!"
            exit 1
          fi
          echo "Sucesso: O commit da tag (${GITHUB_REF_NAME}) pertence à branch origin/main."

  verify-ci:
    name: Verificar se CI concluiu com sucesso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar conclusão com sucesso do workflow CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")
          echo "Verificando se o workflow CI concluiu com sucesso para o commit: $COMMIT_SHA"
          SUCCESS_COUNT=$(gh run list --workflow CI --commit "$COMMIT_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$SUCCESS_COUNT" -eq 0 ] && [ "$COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "Tentando com GITHUB_SHA: $GITHUB_SHA"
            SUCCESS_COUNT=$(gh run list --workflow CI --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          fi
          if [ "$SUCCESS_COUNT" -gt 0 ]; then
            echo "Sucesso: workflow CI concluiu com sucesso para o commit ($SUCCESS_COUNT execução(ões) bem-sucedida(s))."
          else
            echo "::error::Nenhuma execução bem-sucedida do workflow CI foi encontrada para o commit $COMMIT_SHA."
            gh run list --workflow CI --commit "$COMMIT_SHA" --json databaseId,status,conclusion,url || true
            exit 1
          fi

  docker:
    name: Build e Push da Imagem Docker Hub
    environment: docker-release
    needs:
      - verify-tag
      - verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Repositórios que recebem a imagem, um por linha; o primeiro é o canônico. A 2.3.0 sai nos dois (migração para a
      # organização, T-523): um único build empurra o mesmo índice para todos, então o digest, o SBOM e a procedência são
      # idênticos, e cada repositório recebe a sua assinatura. Para aposentar o antigo, apague a linha or4cu1o/empiremuse.
      IMAGE_REPOS: |
        empirecommunity/empiremuse
        or4cu1o/empiremuse
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Autenticar no Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extrair metadados do Docker (tags e labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPOS }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

      - name: Recusar tag cuja imagem já foi publicada
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Reexecutar o job de uma tag publicada reconstruiria a imagem com outro digest e republicaria as tags,
          # enquanto o image-digest.txt (imutável) guarda o digest antigo. Vale para cada repositório da lista: se a versão
          # já existe em qualquer um (inclusive uma publicação dupla interrompida pela metade), o job para.
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            if out=$(docker buildx imagetools inspect "${repo}:${VERSION}" 2>&1); then
              echo "::error::A imagem ${repo}:${VERSION} já existe; uma versão publicada nunca é reconstruída."
              exit 1
            fi
            if ! grep -qiE 'not found|manifest unknown|no such manifest' <<< "$out"; then
              echo "::error::Não foi possível confirmar que a tag está livre em ${repo}: $out"
              exit 1
            fi
          done <<< "$IMAGE_REPOS"

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EMPIREMUSE_VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar o digest publicado
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Digest inválido devolvido pelo build."
            exit 1
          fi
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Instalar o cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Assinar a imagem (cosign keyless)
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          # O mesmo digest nos dois repositórios; cada um guarda a própria assinatura.
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            cosign sign --yes "${repo}@${DIGEST}"
          done <<< "$IMAGE_REPOS"

      - name: Verificar a assinatura (identidade deste workflow)
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          # O índice de referrers do Docker Hub é eventualmente consistente: logo depois do sign a assinatura pode ainda
          # não aparecer. Repete com espera; a identidade e o emissor continuam exatos e, esgotadas as tentativas, falha.
          attempts=6
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            verified=0
            for attempt in $(seq 1 "$attempts"); do
              echo "Verificação da assinatura em ${repo}: tentativa ${attempt}/${attempts}"
              if cosign verify \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity "$IDENTITY" \
                "${repo}@${DIGEST}" > /dev/null; then
                echo "Assinatura de ${repo} verificada na tentativa ${attempt}."
                verified=1
                break
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "Assinatura ainda não encontrada; nova tentativa em 10 s."
                sleep 10
              fi
            done
            if [ "$verified" -ne 1 ]; then
              echo "::error::A assinatura de ${repo}@${DIGEST} não foi verificada em ${attempts} tentativas; a versão não será anunciada."
              exit 1
            fi
          done <<< "$IMAGE_REPOS"

  github-release:
    name: Criar a GitHub Release com o digest
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Criar a release com notas e image-digest.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Digest ausente ou inválido."
            exit 1
          fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag fora do formato vX.Y.Z[-rc.N]."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          PRERELEASE_FLAG=()
          if [ -n "${BASH_REMATCH[2]}" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          # Notas = seção "## [X.Y.Z]" do CHANGELOG.md, até a próxima seção "## [".
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            if [ ${#PRERELEASE_FLAG[@]} -eq 0 ]; then
              echo "::error::O CHANGELOG.md não tem a seção [$VERSION]."
              exit 1
            fi
            echo "Release candidate $GITHUB_REF_NAME." > notes.md
          fi
          printf '%s\n' "$DIGEST" > image-digest.txt
          gh release create "$GITHUB_REF_NAME" image-digest.txt \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${PRERELEASE_FLAG[@]}"
