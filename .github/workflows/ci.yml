name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI (Lint, Compile e Testes)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detectar alterações em código
        id: detect-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Evento '$EVENT_NAME': execução completa ativada."
            exit 0
          fi

          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          DIFF_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only "origin/$BASE_REF" HEAD)
          echo "Arquivos alterados no PR:"
          echo "$DIFF_FILES"

          CODE_CHANGED="false"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.py|empiremuse/*|tests/*|data/*|.example.env|requirements*|*/requirements*|pyproject.toml|*/pyproject.toml|Dockerfile|*/Dockerfile|.github/workflows/*)
                echo "Arquivo de código/configuração detectado: $file"
                CODE_CHANGED="true"
                break
                ;;
            esac
          done <<< "$DIFF_FILES"

          echo "code=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Resultado da detecção de código: code=$CODE_CHANGED"

      - name: Configurar Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Instalar uv
        run: python -m pip install --require-hashes -r .github/ci-uv-requirements.txt

      - name: Verificar integridade e sincronia dos lockfiles
        run: |
          uv pip compile --generate-hashes --universal --exclude-newer 2026-10-20T00:00:00Z --exclude-newer-package yt-dlp=2026-10-26T22:30:00Z --exclude-newer-package certifi=2026-10-23T12:00:00Z --exclude-newer-package brotli=2026-10-22T15:00:00Z --exclude-newer-package brotlicffi=2026-10-22T17:00:00Z requirements.txt -o requirements-lock.txt
          uv pip compile --generate-hashes --universal --exclude-newer 2026-10-20T00:00:00Z requirements-dev.txt -o requirements-dev-lock.txt
          git diff --exit-code requirements-lock.txt requirements-dev-lock.txt

      - name: Instalar dependências com hashes
        run: |
          uv pip install --system --require-hashes -r requirements-lock.txt -r requirements-dev-lock.txt

      - name: Verificação de lint (ruff check)
        run: ruff check .

      - name: Verificação de formatação (ruff format)
        run: ruff format --check .

      - name: Verificação de compilação de bytecode
        run: python -m compileall -q main.py empiremuse

      - name: Verificação estática de tipos (mypy)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: mypy

      - name: Execução dos testes smoke (pytest)
        if: steps.detect-changes.outputs.code == 'true'
        run: pytest -q -m smoke -p no:cacheprovider

      - name: Execução dos testes automatizados (pytest)
        if: steps.detect-changes.outputs.code == 'true'
        run: pytest -q --durations=30 --cov --cov-report=term-missing:skip-covered

      - name: Cobertura das áreas críticas (≥ 90%)
        if: steps.detect-changes.outputs.code == 'true'
        run: coverage report --fail-under=90 --skip-covered --include="empiremuse/panel/*,empiremuse/web_app.py,empiremuse/rpc_protocol.py,empiremuse/rules/*,empiremuse/config_loader.py,empiremuse/utils/db.py,empiremuse/serialization/*,empiremuse/utils/music/legacy_notice.py,empiremuse/utils/music/session_store.py,empiremuse/updater/*,empiremuse/logs/*,empiremuse/health.py,empiremuse/version.py"

  ci-py315:
    name: CI Python 3.15 (não bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detectar alterações em código
        id: detect-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Evento '$EVENT_NAME': execução completa ativada."
            exit 0
          fi

          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          DIFF_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || git diff --name-only "origin/$BASE_REF" HEAD)
          echo "Arquivos alterados no PR:"
          echo "$DIFF_FILES"

          CODE_CHANGED="false"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.py|empiremuse/*|tests/*|data/*|.example.env|requirements*|*/requirements*|pyproject.toml|*/pyproject.toml|Dockerfile|*/Dockerfile|.github/workflows/*)
                echo "Arquivo de código/configuração detectado: $file"
                CODE_CHANGED="true"
                break
                ;;
            esac
          done <<< "$DIFF_FILES"

          echo "code=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Resultado da detecção de código: code=$CODE_CHANGED"

      - name: Configurar Python 3.15
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Instalar uv
        run: python -m pip install --require-hashes -r .github/ci-uv-requirements.txt

      - name: Instalar dependências com hashes
        run: |
          uv pip install --system --require-hashes -r requirements-lock.txt -r requirements-dev-lock.txt

      - name: Verificação de lint (ruff check)
        run: ruff check .

      - name: Verificação de formatação (ruff format)
        run: ruff format --check .

      - name: Verificação de compilação de bytecode
        run: python -m compileall -q main.py empiremuse

      - name: Execução dos testes smoke (pytest)
        if: steps.detect-changes.outputs.code == 'true'
        run: pytest -q -m smoke -p no:cacheprovider

      - name: Execução dos testes automatizados (pytest)
        if: steps.detect-changes.outputs.code == 'true'
        run: pytest -q --durations=30 --cov --cov-report=term-missing:skip-covered

      - name: Cobertura das áreas críticas (≥ 90%)
        if: steps.detect-changes.outputs.code == 'true'
        run: coverage report --fail-under=90 --skip-covered --include="empiremuse/panel/*,empiremuse/web_app.py,empiremuse/rpc_protocol.py,empiremuse/rules/*,empiremuse/config_loader.py,empiremuse/utils/db.py,empiremuse/serialization/*,empiremuse/utils/music/legacy_notice.py,empiremuse/utils/music/session_store.py,empiremuse/updater/*,empiremuse/logs/*,empiremuse/health.py,empiremuse/version.py"

  deploy-check:
    name: Deploy (compose, segredos e gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar os composes (docker compose config -q)
        env:
          EMPIREMUSE_DOMAIN: example.invalid
          DOCKER_GID: "999"
          PANEL_BASE_URL: https://painel.exemplo.invalid
          RPC_PUBLIC_URL: wss://painel.exemplo.invalid/ws
        run: |
          # Valores falsos só para as variáveis obrigatórias; os arquivos .env ficam vazios.
          : > .env
          : > .env.mongo
          for file in deploy/docker-compose*.yml; do
            case "$file" in
              *.traefik.yml) continue ;; # só vale combinado com o base (par abaixo)
            esac
            echo "::group::$file"
            docker compose -f "$file" config -q
            echo "::endgroup::"
          done
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.traefik.yml config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.deps.yml config -q

      - name: Nenhuma porta publicada fora de 127.0.0.1
        env:
          EMPIREMUSE_DOMAIN: example.invalid
          DOCKER_GID: "999"
          PANEL_BASE_URL: https://painel.exemplo.invalid
          RPC_PUBLIC_URL: wss://painel.exemplo.invalid/ws
        run: |
          : > .env
          : > .env.mongo
          check_ports() {
            exposed=$(docker compose "$@" config --format json | jq -r '.services | to_entries[] | .key as $svc | (.value.ports // [])[] | select((.host_ip // "") != "127.0.0.1") | "\($svc): \(.published // "?")->\(.target)"')
            if [ -n "$exposed" ]; then
              echo "Porta fora de 127.0.0.1 em: $*" >&2
              echo "$exposed" >&2
              exit 1
            fi
          }
          for file in deploy/docker-compose*.yml; do
            case "$file" in
              *.traefik.yml) continue ;;
            esac
            check_ports -f "$file"
          done
          check_ports -f deploy/docker-compose.yml -f deploy/docker-compose.traefik.yml
          check_ports -f deploy/docker-compose.yml -f deploy/docker-compose.deps.yml

      - name: Validar o egg do Pterodactyl (JSON)
        run: python3 -m json.tool deploy/pterodactyl/egg-empiremuse.json > /dev/null

      - name: Validar scripts de deploy (sh -n e shellcheck)
        run: |
          scripts=$(find deploy -name '*.sh' -type f)
          [ -z "$scripts" ] && { echo "Nenhum script em deploy/."; exit 0; }
          for script in $scripts; do
            sh -n "$script"
            shellcheck -s sh "$script"
          done

      - name: Scripts de deploy/local sem download, sudo, eval nem execução por pipe
        run: |
          files=$(find deploy/local -type f \( -name '*.sh' -o -name '*.bat' \) 2> /dev/null)
          [ -z "$files" ] && { echo "Nenhum script em deploy/local."; exit 0; }
          # Vale para a linha inteira, inclusive comentário e mensagem.
          if grep -nEiw 'curl|wget|sudo|eval|iex|irm|Invoke-Expression|Invoke-WebRequest' $files || grep -nE '\|[[:space:]]*(ba)?sh([[:space:]]|$)' $files; then
            echo "Termo proibido nos scripts de deploy/local (ver as linhas acima)." >&2
            exit 1
          fi

      - name: Chaves de segredo sem valor literal em deploy/ e nos *.example*
        run: python3 -I .github/scripts/check_deploy_secrets.py

      - name: Verificador de segredos recusa literais (mapa, lista, .env e webhook) e aceita as formas válidas
        run: |
          script="$PWD/.github/scripts/check_deploy_secrets.py"
          for line in '      TOKEN: abc' '      - TOKEN=abc' '      - "MONGO=abc"' 'TOKEN=abc' '      MONGO: ${MONGO:-abc}' '      BOT_ADD_REMOVE_LOG: https://discord.com/api/webhooks/1/abc' '      - LOG=https://discordapp.com/api/webhooks/1/abc' '      PIN_PASSWORD: "123456"'; do
            workdir=$(mktemp -d)
            mkdir "$workdir/deploy"
            printf '%s\n' "$line" > "$workdir/deploy/fixture.example"
            if (cd "$workdir" && python3 -I "$script" 2> /dev/null); then
              echo "O verificador deixou passar: $line" >&2
              exit 1
            fi
          done
          for line in '      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD:?defina}' '      - TOKEN=' '      MONGO_TIMEOUT: "30"' '      "TOKEN": "${TOKEN}"'; do
            workdir=$(mktemp -d)
            mkdir "$workdir/deploy"
            printf '%s\n' "$line" > "$workdir/deploy/fixture.example"
            (cd "$workdir" && python3 -I "$script") || { echo "O verificador recusou uma forma válida: $line" >&2; exit 1; }
          done

      - name: docker.sock e /run só nos compose da Hostinger
        run: |
          # Todo arquivo de deploy/ (qualquer pasta ou extensão). Comentário é '#' no início da linha ou depois de espaço;
          # só os dois nomes exatos abaixo podem citar o socket ou montar /run e /var/run.
          allowed='deploy/docker-compose\.hostinger(-sem-traefik)?\.yml'
          code='^(?!\s*#)(?:(?!\s#).)*'
          sock=$(grep -rlP "${code}docker\.sock" deploy/ | grep -vxE "$allowed" || true)
          run_mount=$(grep -rlP "${code}(?:^|[\s\"':=\[,])/(?:var/)?run/?(?:[\"':\s\],]|$)" deploy/ | grep -vxE "$allowed" || true)
          if [ -n "$sock$run_mount" ]; then
            echo "docker.sock ou montagem de /run fora dos dois compose da Hostinger:" >&2
            printf '%s\n' "$sock" "$run_mount" >&2
            exit 1
          fi

      - name: Varredura de segredos (gitleaks) em deploy/
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir deploy/ --no-banner --redact
